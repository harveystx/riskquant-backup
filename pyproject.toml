[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskquant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "matplotlib>=3.10",
]

# Dev-only tooling (not installed for normal users)
[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "black>=24.0",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["riskquant*"]

# --- Tooling config ---
[tool.black]
line-length = 80
target-version = ["py310"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
fixable = ["ALL"]