[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskquant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "matplotlib>=3.10",
  "scipy>=1.15",
  "numba>=0.59",
  "seaborn>=0.13",
  "pandas-stubs>=2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]
scripts = [
  "python-dotenv>=1.0,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
]
notebooks = [
  "marimo[recommended]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["riskquant*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["riskquant"]
