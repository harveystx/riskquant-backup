[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskquant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "openpyxl>=3.1",
]


[tool.setuptools]
package-dir = {"" = "src"}
packages = ["riskquant"]
