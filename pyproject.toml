[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskquant"
version = "0.2.0"
description = "Quantitative risk management library"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3.1",
    "openpyxl>=3.1",
    "scipy>=1.15,<2",
    "scikit-learn>=1.9",
    "numba>=0.59,<0.67",
    "pandas-stubs>=2.0",
    "polars>=1.0",
    "fastexcel>=0.7.0",
    "xlsxwriter>=3.1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]

dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "hypothesis>=6.0",
]

scripts = [
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "matplotlib>=3.10",
    "seaborn>=0.13",
]

notebooks = [
    "marimo[recommended]",
    "matplotlib>=3.10",
    "seaborn>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/riskquant",
    "src/riskquant_lab",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "NPY",
    "RUF",
]

ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["riskquant", "riskquant_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
preview = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "dcor",
    "dcor.*",
    "sklearn",
    "sklearn.*",
    "scipy",
    "scipy.*",
    "seaborn",
    "seaborn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Numba ships partial annotations: prange is declared non-iterable,
# get_thread_id is not re-exported, and the jit decorators are untyped.
# Skipping the follow resolves the whole surface to Any, which is the
# honest description of an untyped compiler API.
module = [
    "numba",
    "numba.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Numba's decorators are untyped, so every kernel would otherwise trip
# disallow_untyped_decorators. The kernels carry explicit nb signatures
# and full annotations; only the decorator's own typing is unavailable.
module = [
    "riskquant.dependence._kernels.*",
    "riskquant.observations._kernels",
    "riskquant.market_state._kernels",
]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Test modules share basenames across packages (test_engine.py, test_compile.py,
# test_demo_scripts_are_runnable.py); the default prepend import mode refuses
# the second one ("import file mismatch") and silently drops those tests from
# the full run. importlib mode gives each file a unique module identity.
addopts = "--import-mode=importlib"
